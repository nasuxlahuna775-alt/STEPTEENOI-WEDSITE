<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEPTEENOI — Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="members-page">

<!-- GRAIN -->
<div class="grain"></div>

<!-- TOPBAR -->
<header class="topbar">
  <a class="wordmark" href="index.html">
    <div class="brand-mark">S</div>
    <div class="brand-name">STEPTEENOI</div>
  </a>
  <nav class="topnav">
    <a href="index.html">HOME</a>
    <a href="members.html" class="active">MEMBERS</a>
    <a href="admin.html">ADMIN</a>
  </nav>
</header>

<!-- HERO -->
<section class="members-hero">
  <h1 class="hero-title-members">HOUSE OF STEPTEENOI</h1>
  <p class="hero-sub-members thai-text">รายชื่อสมาชิกทั้งหมด</p>
</section>

<!-- CONTROLS -->
<section class="members-controls">
  <div class="search-box">
    <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อในระบบ..." class="search-input thai-text">
  </div>
  <div class="filter-row">
    <button class="filter-btn is-active" data-filter="all">ทั้งหมด</button>
    <button class="filter-btn" data-filter="owner">OWNER</button>
    <button class="filter-btn" data-filter="core">LEADER</button>
    <button class="filter-btn" data-filter="member">MEMBERS</button>
  </div>
  <div class="people-count" id="peopleCount">-- MEMBERS</div>
</section>

<!-- ROSTER -->
<section class="members-roster">
  <div id="roster"></div>
  <div class="pagination" id="pagination"></div>
</section>

<!-- PROFILE DIALOG -->
<dialog class="profile-dialog" id="profileDialog">
  <div class="dialog-body">
    <button class="dialog-close" id="dialogClose">&times;</button>
    <div class="dialog-media" id="dialogMedia"></div>
    <div class="dialog-role" id="dialogRole"></div>
    <div class="dialog-name thai-text" id="dialogName"></div>
    <div class="dialog-blurb thai-text" id="dialogBlurb"></div>
    <div class="dialog-meta" id="dialogMeta"></div>
  </div>
</dialog>

<!-- MUSIC PLAYER (bottom right) -->
<div class="music-player" id="musicPlayer">
  <button class="music-btn" id="musicBtn">▶</button>
  <span class="music-title-text">NOW PLAYING</span>
  <span class="music-status" id="musicStatus">⏳ กำลังโหลดเพลง...</span>
  <div class="music-progress"><div class="music-progress-fill" id="musicProgress"></div></div>
</div>

<footer class="members-footer">&copy; 2026 STEPTEENOI</footer>

<script src="firebase-config.js"></script>
<script src="member-images.js"></script>
<script src="members.js"></script>
<script src="site-config.js"></script>
<script src="music-player.js"></script>
<script src="site.js"></script>
</body>
</html>
